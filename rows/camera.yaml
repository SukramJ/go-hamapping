# Home Assistant's camera: a live stream when it has the STREAM feature.
# The Camera's stream clusters run on the consumer's host ports
# (ports: host, Options.Ports); the host relays the controller's WebRTC
# offer and answer and does not read the stream.
platform: camera
cites:
  - go-ha-catalog data/features.json:10-13 (camera feature flags ON_OFF 1, STREAM 2)
  - home-assistant/core homeassistant/components/camera/const.py:71-75 @2026.10.3 (CameraEntityFeature ON_OFF = 1, STREAM = 2)
rows:
  - id: camera
    when: {features: {any: [STREAM]}}
    type: Camera
    verdict: mappable
    caveats:
      - when: {}
        reason: "the stream declaration is nominal: Home Assistant reports no codec, resolution or frame rate for a camera; the host relays the offer and answer and does not read the stream"
      - when: {features: {any: [ON_OFF]}}
        reason: "turning the camera on or off is not mapped: the Camera device type lists no OnOff"
    cites:
      - "home-assistant/core homeassistant/components/camera/__init__.py:742-755 @2026.10.3 (camera_capabilities: the stream types WEB_RTC and HLS under STREAM; no codec, resolution or frame rate)"
      - "go-fabric device/camera_gen.go:34-71 @v0.15.5 (Camera: CameraAvStreamManagement with VDO, ADO, SNP and WebRtcTransportProvider mandatory; no OnOff)"
      - go-fabric device/device.go:431-439 @v0.15.5 (a selection that leaves out a mandated feature is ErrConfiguration)
      - go-fabric device/defaults_camera.go:110-125,147-157 @v0.15.5 (the kit's AvStream and Provider servers run on the Declare's ports)
      - go-fabric cluster/camera/avstream.go:194-198 @v0.15.5 (VDO needs a VideoStreamPort, ADO an AudioStreamPort, SNP a SnapshotStreamPort and a SnapshotCapturePort)
      - "go-fabric cluster/camera/avstream.go:262-306 @v0.15.5 (chipDefaults: the scalars only; the capability structures and lists start unset)"
      - go-fabric cluster/spec/cameraavstreammanagement/definition_gen.go:396,545 @v0.15.5 (RequiresHardwareEncoder only with RequiresEncodedPixels; MaxHdrfps only with HDR, which the row does not select)
      - connectedhomeip data_model/1.7/clusters/CameraAVStreamManagement.xml:173-185 @1dc3b69ed5e (H264 is the mandatory video codec)
      - connectedhomeip examples/camera-app/linux/include/camera-device.h:42-44,48,52-53,58-59,66-67 @1dc3b69ed5e (the camera app's MaxContentBufferSize 4096, MaxNetworkBandwidth 128000000, MaxConcurrentEncoders 1, MaxEncodedPixelRate 248832000, min resolution 640x480, snapshot 30 fps, video 120 fps, sensor 1920x1080)
      - connectedhomeip examples/camera-app/linux/src/camera-device.cpp:1515-1520,1557-1568,1596-1603,1652-1657 @1dc3b69ed5e (VideoSensorParams, MinViewport, one H264 RateDistortionTradeOff point, the first JPEG SnapshotCapabilities entry, LiveView among the supported stream usages)
      - "connectedhomeip examples/camera-app/linux/src/camera-device.cpp:1986-1987 @1dc3b69ed5e (the app's mono LiveView audio stream: Opus, one channel, 48000 Hz, 24 bit; its MicrophoneCapabilities at :1576-1584 offer 8 channels, Opus and AAC-LC)"
    clusters:
      - cluster: CameraAvStreamManagement
        features: [Video, Audio, Snapshot]
        ports: host
        initial:
          - {attribute: SupportedStreamUsages, literal: [StreamUsageLiveView]}
          - {attribute: MaxConcurrentEncoders, const: 1}
          - {attribute: MaxEncodedPixelRate, const: 248832000}
          - {attribute: MaxNetworkBandwidth, const: 128000000}
          - {attribute: MaxContentBufferSize, const: 4096}
          - {attribute: VideoSensorParams, literal: {SensorWidth: 1920, SensorHeight: 1080, MaxFps: 120}}
          - {attribute: MinViewportResolution, literal: {Width: 640, Height: 480}}
          - attribute: RateDistortionTradeOffPoints
            literal:
              - {Codec: VideoCodecH264, Resolution: {Width: 640, Height: 480}, MinBitRate: 10000}
          - attribute: MicrophoneCapabilities
            literal: {MaxNumberOfChannels: 1, SupportedCodecs: [AudioCodecOpus], SupportedSampleRates: [48000], SupportedBitDepths: [24]}
          - attribute: SnapshotCapabilities
            literal:
              - {Resolution: {Width: 640, Height: 480}, MaxFrameRate: 30, ImageCodec: ImageCodecJpeg, RequiresEncodedPixels: false}
      - cluster: WebRtcTransportProvider
        ports: host
  - id: unmapped
    when: {}
    verdict: "unmappable: a camera without the STREAM feature has no live stream; a SnapshotCamera row is a later wave"
