# Home Assistant's cover. HA's position is 0 (closed) to 100 (open); Matter's
# is the closed share in hundredths of a percent, 10000 fully closed.
platform: cover
cites:
  - go-ha-catalog data/mqtt.json:1648-1912 (cover schema; payload_open/close/stop at 1756-1775, set_position_topic at 1816, tilt_command_topic at 1861)
  - go-ha-catalog data/features.json:25-35 (cover feature flags)
  - go-ha-catalog data/device_classes.json:38-49 (cover device classes)
rows:
  - id: window_covering
    when: {}
    type: WindowCovering
    verdict: mappable
    caveats:
      - when: {device_class: [garage, gate, door, damper]}
        reason: "WindowCovering has no type for a {device_class}: Type and EndProductType are Unknown"
      - when: {device_class: [window], features: {any: [OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
        reason: "a tilting window has no WindowCovering product: EndProductType is Unknown"
    cites:
      - matter.js packages/model/src/standard/elements/window-covering-device.element.ts:24 @862ad75f (WindowCovering mandatory)
      - matter.js packages/model/src/standard/resources/window-covering-cluster.resource.ts:39,98,116-118,180-199 @862ad75f (Type, EndProductType, CurrentPositionLiftPercent100ths; DownOrClose ends at 100.00%)
      - "go-fabric cluster/spec/windowcovering/definition_gen.go:104-128,273-283 @v0.25.0 (EndProductType and Type conformance: under LF & TL only TiltBlindLift, SheerShade, InteriorBlind, VerticalBlindStripCurtain, InteriorVenetianBlind, ExteriorVenetianBlind and Unknown)"
      - go-fabric cluster/cover/windowcovering_server.go:375-378,391-399 @v0.25.0 (Lift or Tilt required; Type and EndProductType checked against the FeatureMap)
      - "home-assistant/core homeassistant/components/cover/services.py:49-62 @2026.10.3 (set_cover_position requires SET_POSITION, stop_cover requires STOP)"
      - "home-assistant/core homeassistant/components/cover/services.py:60-62,85-90 @2026.10.3 (stop_cover requires STOP, stop_cover_tilt requires STOP_TILT)"
      - home-assistant/core homeassistant/components/cover/const.py:44-54 @2026.10.3 (CoverEntityFeature OPEN 1, CLOSE 2, SET_POSITION 4, STOP 8, OPEN_TILT 16, CLOSE_TILT 32, STOP_TILT 64, SET_TILT_POSITION 128)
      - "home-assistant/core homeassistant/components/cover/services.py:35-45,72-82,93-100 @2026.10.3 (open_cover requires OPEN, close_cover CLOSE, open_cover_tilt OPEN_TILT, close_cover_tilt CLOSE_TILT, set_cover_tilt_position SET_TILT_POSITION)"
      - home-assistant/core homeassistant/components/switchbot/cover.py:176-181 @2026.10.3 (a tilt-only cover, device_class blind, features 240)
      - "home-assistant-matter-hub packages/backend/src/matter/endpoints/legacy/cover/behaviors/cover-window-covering-server.ts:67-111,242-258,283-297,385-395 @664575a (Type and EndProductType corrected by tilt; lift commands of a tilt-only cover go to tilt; open/close_cover_tilt without SET_TILT_POSITION)"
      - home-assistant/core homeassistant/helpers/service.py:750-760 @2026.10.3 (a call on a referenced entity without the feature raises ServiceNotSupported)
      - "go-fabric cluster/spec/windowcovering/definition_gen.go:96,120,245,253 @v0.27.0 (Rollershade and RollerShade only under LF & !TL; TiltBlindLift under LF & TL; EndProductType Unknown under any FeatureMap)"
      - "go-fabric cluster/spec/windowcovering/definition_gen.go:37,40,51 @v0.27.0 (with PositionAwareLift: TargetPositionLiftPercent100ths and CurrentPositionLiftPercent100ths mandatory and nullable, GoToLiftPercentage mandatory)"
      - go-fabric device/defaults.go:449-458 @v0.27.0 (a position without an initial value reads null)
      - "home-assistant/core homeassistant/components/cover/__init__.py:217-218,239-240 @2026.10.3 (current_position is in the state whenever the entity has a position, whatever its features; the default features add SET_POSITION exactly when it has one)"
      - home-assistant-matter-hub packages/backend/src/matter/endpoints/legacy/cover/index.ts:34-49 @664575a (Lift and PositionAwareLift always)
      - "home-assistant-matter-hub packages/backend/src/matter/endpoints/legacy/cover/behaviors/cover-window-covering-server.ts:57-64,78-102,330-342,392-410 @664575a (a lift-only window Rollershade / RollerShade, a tilting one TiltBlindLift / Unknown; the lift position from current_position, else closed 0 and open 100 on Home Assistant's scale, else null; GoToLiftPercentage without position control by a 50 % threshold, which this row does not take)"
      - "matter.js packages/node/src/behaviors/window-covering/WindowCoveringServer.ts:579-584 @db021da0 (with positionAwareLift the requested LiftPercent100thsValue becomes the target; the row hands out only 0 and 10000 and refuses the rest, docs/by_design.md)"
      - "matter.js packages/node/src/behaviors/window-covering/WindowCoveringServer.ts:598-614 @db021da0 (with positionAwareTilt the requested TiltPercent100thsValue becomes the target, :601-606; without it 0 opens, else closes, :607-613 — the rule the row leaves by declaring PositionAwareTilt on every tilting cover)"
      - matter.js packages/model/src/standard/resources/window-covering-cluster.resource.ts:265-266 @862ad75f (without the PositionAware feature a zero tilt percentage is UpOrOpen, a non-zero one DownOrClose)
    clusters:
      - cluster: WindowCovering
        features:
          - Lift
          - PositionAwareLift
          - {name: Tilt, when: {features: {any: [OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}}
          - {name: PositionAwareTilt, when: {features: {any: [OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}}
        initial:   # Lift only: the LF & !TL members; with Tilt (the feature's predicate): TiltBlindLift and the LF & TL members
          - attribute: Type
            from: device_class
            when: {features: {none: [OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            enum: {shutter: TypeShutter, blind: TypeRollershade, shade: TypeRollershade, curtain: TypeDrapery, awning: TypeAwning, garage: TypeUnknown, gate: TypeUnknown, door: TypeUnknown, damper: TypeUnknown, window: TypeRollershade, "": TypeRollershade}
          - attribute: EndProductType
            from: device_class
            when: {features: {none: [OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            enum: {shutter: EndProductTypeRollerShutter, blind: EndProductTypeRollerShade, shade: EndProductTypeRollerShade, curtain: EndProductTypeCentralCurtain, awning: EndProductTypeAwningTerracePatio, garage: EndProductTypeUnknown, gate: EndProductTypeUnknown, door: EndProductTypeUnknown, damper: EndProductTypeUnknown, window: EndProductTypeRollerShade, "": EndProductTypeRollerShade}
          - attribute: Type
            from: device_class
            when: {features: {any: [OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            enum: {shutter: TypeTiltBlindLift, blind: TypeTiltBlindLift, shade: TypeTiltBlindLift, curtain: TypeTiltBlindLift, awning: TypeTiltBlindLift, garage: TypeUnknown, gate: TypeUnknown, door: TypeUnknown, damper: TypeUnknown, window: TypeTiltBlindLift, "": TypeTiltBlindLift}
          - attribute: EndProductType
            from: device_class
            when: {features: {any: [OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            enum: {shutter: EndProductTypeExteriorVenetianBlind, blind: EndProductTypeInteriorBlind, shade: EndProductTypeSheerShade, curtain: EndProductTypeVerticalBlindStripCurtain, awning: EndProductTypeUnknown, garage: EndProductTypeUnknown, gate: EndProductTypeUnknown, door: EndProductTypeUnknown, damper: EndProductTypeUnknown, window: EndProductTypeUnknown, "": EndProductTypeInteriorBlind}
        attributes:
          # Without SET_POSITION the lift position is the state's (open,
          # closed; moving is unknown) unless the state carries a position,
          # which the later lines then set.
          - {attribute: CurrentPositionLiftPercent100ths, from: state, enum: {open: 0, closed: 10000, opening: null, closing: null}, when: {features: {none: [SET_POSITION]}}}
          - {attribute: TargetPositionLiftPercent100ths, from: state, enum: {open: 0, closed: 10000, opening: null, closing: null}, when: {features: {none: [SET_POSITION]}}}
          - {attribute: CurrentPositionLiftPercent100ths, from: state.current_position, offset: -100, scale: -100, min: 0, max: 10000}
          - {attribute: TargetPositionLiftPercent100ths, from: state.current_position, offset: -100, scale: -100, min: 0, max: 10000}
          - {attribute: CurrentPositionTiltPercent100ths, from: state.current_tilt_position, offset: -100, scale: -100, min: 0, max: 10000, when: {features: {any: [SET_TILT_POSITION]}}}
          - {attribute: TargetPositionTiltPercent100ths, from: state.current_tilt_position, offset: -100, scale: -100, min: 0, max: 10000, when: {features: {any: [SET_TILT_POSITION]}}}
        # Lift commands: to the lift where the cover has a lift axis (any of
        # OPEN, CLOSE, SET_POSITION) or neither axis; a tilt-only cover (no
        # lift, a tilt) has neither open_cover, close_cover nor
        # set_cover_position, so they go to its tilt, as matter-hub does:
        # set_cover_tilt_position where it has SET_TILT_POSITION, else
        # open_cover_tilt / close_cover_tilt (methods open_tilt, close_tilt).
        commands:
          - handle: UpOrOpen
            when: {features: {any: [OPEN, CLOSE, SET_POSITION]}}
            raw: {from: extra.payload_open, catalog: true}
          - handle: UpOrOpen
            when: {features: {none: [OPEN, CLOSE, SET_POSITION, OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            raw: {from: extra.payload_open, catalog: true}
          - handle: UpOrOpen
            when: {features: {all: [SET_TILT_POSITION], none: [OPEN, CLOSE, SET_POSITION]}}
            method: tilt
            raw: {const: 100}
          - handle: UpOrOpen
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [OPEN, CLOSE, SET_POSITION, SET_TILT_POSITION]}}
            method: open_tilt
            raw: {const: OPEN}
          - handle: DownOrClose
            when: {features: {any: [OPEN, CLOSE, SET_POSITION]}}
            raw: {from: extra.payload_close, catalog: true}
          - handle: DownOrClose
            when: {features: {none: [OPEN, CLOSE, SET_POSITION, OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            raw: {from: extra.payload_close, catalog: true}
          - handle: DownOrClose
            when: {features: {all: [SET_TILT_POSITION], none: [OPEN, CLOSE, SET_POSITION]}}
            method: tilt
            raw: {const: 0}
          - handle: DownOrClose
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [OPEN, CLOSE, SET_POSITION, SET_TILT_POSITION]}}
            method: close_tilt
            raw: {const: CLOSE}
          - handle: StopMotion
            when: {features: {any: [STOP]}}
            raw: {from: extra.payload_stop, catalog: true}
          - handle: StopMotion   # STOP_TILT without STOP: stop_cover_tilt; with both, stop_cover only
            when: {features: {all: [STOP_TILT], none: [STOP]}}
            method: stop_tilt
            raw: {const: STOP}
          - handle: GoToLiftPercentage
            when: {features: {any: [SET_POSITION]}}
            method: set_position
            raw: {field: LiftPercent100thsValue, scale: -0.01, add: 100}
          # Without SET_POSITION: fully open (0) opens, fully closed
          # (10000) closes, a position between is refused with FAILURE and
          # handed out to no one (docs/by_design.md).
          - handle: GoToLiftPercentage
            when: {features: {any: [OPEN, CLOSE], none: [SET_POSITION]}}
            if: {field: LiftPercent100thsValue, in: [0]}
            raw: {from: extra.payload_open, catalog: true}
          - handle: GoToLiftPercentage
            when: {features: {any: [OPEN, CLOSE], none: [SET_POSITION]}}
            if: {field: LiftPercent100thsValue, in: [10000]}
            raw: {from: extra.payload_close, catalog: true}
          - handle: GoToLiftPercentage
            when: {features: {any: [OPEN, CLOSE], none: [SET_POSITION]}}
            if: {field: LiftPercent100thsValue, not_in: [0, 10000]}
            refuse: FAILURE
          - handle: GoToLiftPercentage
            when: {features: {none: [OPEN, CLOSE, SET_POSITION, OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            if: {field: LiftPercent100thsValue, in: [0]}
            raw: {from: extra.payload_open, catalog: true}
          - handle: GoToLiftPercentage
            when: {features: {none: [OPEN, CLOSE, SET_POSITION, OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            if: {field: LiftPercent100thsValue, in: [10000]}
            raw: {from: extra.payload_close, catalog: true}
          - handle: GoToLiftPercentage
            when: {features: {none: [OPEN, CLOSE, SET_POSITION, OPEN_TILT, CLOSE_TILT, SET_TILT_POSITION]}}
            if: {field: LiftPercent100thsValue, not_in: [0, 10000]}
            refuse: FAILURE
          - handle: GoToLiftPercentage
            when: {features: {all: [SET_TILT_POSITION], none: [OPEN, CLOSE, SET_POSITION]}}
            method: tilt
            raw: {field: LiftPercent100thsValue, scale: -0.01, add: 100}
          - handle: GoToLiftPercentage
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [OPEN, CLOSE, SET_POSITION, SET_TILT_POSITION]}}
            if: {field: LiftPercent100thsValue, in: [0]}
            method: open_tilt
            raw: {const: OPEN}
          - handle: GoToLiftPercentage
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [OPEN, CLOSE, SET_POSITION, SET_TILT_POSITION]}}
            if: {field: LiftPercent100thsValue, in: [10000]}
            method: close_tilt
            raw: {const: CLOSE}
          - handle: GoToLiftPercentage
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [OPEN, CLOSE, SET_POSITION, SET_TILT_POSITION]}}
            if: {field: LiftPercent100thsValue, not_in: [0, 10000]}
            refuse: FAILURE
          - handle: GoToTiltPercentage
            when: {features: {any: [SET_TILT_POSITION]}}
            method: tilt
            raw: {field: TiltPercent100thsValue, scale: -0.01, add: 100}
          # Without SET_TILT_POSITION: fully open (0) opens, fully closed
          # (10000) closes, a tilt between is refused with FAILURE
          # (docs/by_design.md).
          - handle: GoToTiltPercentage
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [SET_TILT_POSITION]}}
            if: {field: TiltPercent100thsValue, in: [0]}
            method: open_tilt
            raw: {const: OPEN}
          - handle: GoToTiltPercentage
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [SET_TILT_POSITION]}}
            if: {field: TiltPercent100thsValue, in: [10000]}
            method: close_tilt
            raw: {const: CLOSE}
          - handle: GoToTiltPercentage
            when: {features: {any: [OPEN_TILT, CLOSE_TILT], none: [SET_TILT_POSITION]}}
            if: {field: TiltPercent100thsValue, not_in: [0, 10000]}
            refuse: FAILURE
